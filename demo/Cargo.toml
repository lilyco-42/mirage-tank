[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "demo"

# 显式声明 bin 的名称为 demo-cli，入口为 src/main.rs
[[bin]]
name = "demo-cli"
path = "src/main.rs"

[dependencies]
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
jni = { version = "0.21.1", features = ["invocation"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
